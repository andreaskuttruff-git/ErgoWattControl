# Builds the app whenever a version tag (v1.0.0, …) is pushed and publishes a GitHub release with
# - ErgoWattControl-Setup-<tag>.exe: WiX setup, installs the .NET 10 Desktop Runtime if missing, then the app
# - ErgoWattControl-<tag>-win-x64.zip: the app to unpack anywhere (needs the .NET 10 Desktop Runtime)
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup (app, .NET runtime, WiX bundle)
        shell: pwsh
        run: ./Setup/build-setup.ps1 -Version ("${{ github.ref_name }}".TrimStart('v'))

      - name: Zip and setup file names
        shell: pwsh
        run: |
          Compress-Archive -Path Setup/out/app/* -DestinationPath "ErgoWattControl-${{ github.ref_name }}-win-x64.zip"
          Copy-Item Setup/out/ErgoWattControl-Setup.exe "ErgoWattControl-Setup-${{ github.ref_name }}.exe"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          "ErgoWattControl-Setup-${{ github.ref_name }}.exe" "ErgoWattControl-${{ github.ref_name }}-win-x64.zip"
          --title "ErgoWattControl ${{ github.ref_name }}" --notes-file .github/release-notes.md
