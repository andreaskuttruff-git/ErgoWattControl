# Builds the app and publishes it as a ZIP on a GitHub release whenever a version tag (v1.0.0, …) is pushed.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet publish ErgoWattControl.csproj -c Release -r win-x64 --self-contained false -o out

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path out/* -DestinationPath "ErgoWattControl-${{ github.ref_name }}-win-x64.zip"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" "ErgoWattControl-${{ github.ref_name }}-win-x64.zip"
          --title "ErgoWattControl ${{ github.ref_name }}" --notes-file .github/release-notes.md
